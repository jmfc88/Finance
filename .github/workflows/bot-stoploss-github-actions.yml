# VERSION: 6 (28/08/2026) - SEIS arranques al dia cada 4 horas exactas, con un
# bucle de 4h07 que mira el precio cada 13 minutos. Horas y minutos poco
# habituales a proposito, para esquivar la cola saturada de GitHub.
#
# VERSION: 5 (27/08/2026) - cinco arranques al dia con bucle de 5h20 cada 20
# minutos. El bucle funciono (la ejecucion manual duro 5h20m41s en verde) pero
# el cron seguia sin saltar.
# Medido el 27/08: con '*/15' GitHub ejecutaba 2 veces al dia de 96 pedidas.
#
# VERSION: 3 (26/08/2026) - corre todo el dia; el horario lo decide bot.py
# segun el mercado de cada accion.
#
# VERSION: 2 (04/08/2026) - de cada 30 a cada 15 minutos, y ahora tambien
# avisa (no solo actualiza en silencio) cuando el stop-loss sube
name: Vigilancia de stop-loss

on:
  schedule:
    # SEIS arranques al dia, cada 4 horas exactas, con un bucle de 4 horas
    # dentro que mira el precio cada 13 minutos.
    #
    # Las horas del cron son UTC. Estas corresponden a las 02:11, 06:11,
    # 10:11, 14:11, 18:11 y 22:11 HORA ESPANOLA en horario de verano; en
    # invierno caen una hora antes.
    #
    # El minuto 11 y el intervalo de 13 minutos son a proposito: son numeros
    # que casi nadie usa. A las :00, :15 o :30 la cola de GitHub esta llena de
    # todo el mundo, y los workflows programados de repositorios gratuitos van
    # los ultimos. El 28/08 se comprobo que ni siquiera cinco arranques al dia
    # salian con fiabilidad.
    - cron: '11 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

# Solo una ejecucion viva a la vez. Cada una dura 4h07 y arrancan cada 4h, asi
# que se solapan 7 minutos; sin esto, las dos escribirian en posiciones.json y
# chocarian al hacer push. Al arrancar la nueva se cancela la vieja, que ya ha
# cubierto su franja entera.
concurrency:
  group: vigilancia-stop-loss
  cancel-in-progress: true

jobs:
  vigilar-stop-loss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance requests

      - name: Vigilar posiciones abiertas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # Bucle de 20 vueltas separadas 13 minutos = 4 horas y 7 minutos.
        # Los 7 minutos de mas son el solape con el arranque siguiente: si
        # GitHub se retrasa un poco, no queda ningun hueco sin vigilar.
        #
        # Un trabajo de GitHub Actions no puede pasar de 6 horas, asi que 4h07
        # deja margen de sobra.
        #
        # timeout-minutes evita que un trabajo colgado se quede consumiendo la
        # maquina hasta el limite duro.
        #
        # Despues de cada vuelta se guarda posiciones.json: si GitHub cancela
        # la ejecucion a mitad, no se pierde el estado de los avisos ya
        # mandados y no se repiten al arrancar de nuevo.
        timeout-minutes: 255
        run: |
          for vuelta in $(seq 1 20); do
            echo "--- vuelta $vuelta de 20 · $(date -u '+%H:%M UTC') ---"
            python bot.py || echo "la vuelta $vuelta ha fallado, se sigue con la siguiente"
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add posiciones.json 2>/dev/null || true
            if ! git diff --staged --quiet; then
              git commit -m "actualiza estado de vigilancia (vuelta $vuelta)"
              git pull --rebase origin main && git push || echo "no se pudo subir, se reintenta en la siguiente vuelta"
            fi
            if [ "$vuelta" -lt 20 ]; then
              echo "esperando 13 minutos..."
              sleep 780
            fi
          done
