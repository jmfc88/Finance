# VERSION: 4 (27/08/2026) - cada 20 min las 24 h; el horario lo decide bot.py
# preguntando a Yahoo si el mercado de cada accion esta abierto.
# Medido el 27/08: con '*/15' GitHub ejecutaba 2 veces al dia de 96 pedidas.
#
# VERSION: 3 (26/08/2026) - corre todo el dia; el horario lo decide bot.py
# segun el mercado de cada accion.
#
# VERSION: 2 (04/08/2026) - de cada 30 a cada 15 minutos, y ahora tambien
# avisa (no solo actualiza en silencio) cuando el stop-loss sube
name: Vigilancia de stop-loss

on:
  schedule:
    # Cada 20 minutos, las 24 horas, de domingo a viernes.
    #
    # No hay franjas por mercado a proposito. bot.py pregunta a Yahoo si el
    # mercado de CADA accion esta abierto (campo marketState) y, si no lo esta,
    # sale en dos segundos sin gastar nada. Asi el horario se ajusta solo a lo
    # que haya en cartera, sin tocar este archivo nunca mas: da igual comprar
    # en Milan, en Nueva York o en Shenzhen.
    #
    # Se probo lo contrario -recortar la franja a las horas de Milan- pero
    # obliga a editar el cron con cada compra en otro mercado, y olvidarlo
    # significa quedarse sin vigilancia justo cuando hace falta.
    #
    # Los minutos 6, 26 y 46 son a proposito: casi todo el mundo programa en
    # punto y a las :00 la cola de GitHub esta saturada. Un minuto impar tiene
    # mas posibilidades de salir puntual.
    #
    # PENDIENTE DE MEDIR: el 27/08 se comprobo que con '*/15' (96 al dia)
    # GitHub solo ejecutaba DOS. No se sabe si pedir menos ayuda. Con esta
    # configuracion se piden 72 al dia; hay que contar cuantas salen de verdad
    # antes de volver a tocar nada, y cambiar UNA cosa cada vez.
    #
    # El sabado no corre: no abre ningun mercado. El domingo si, porque el
    # lunes asiatico y australiano empieza el domingo por la noche en UTC.
    - cron: '6,26,46 * * * 0-5'
  workflow_dispatch: {}

jobs:
  vigilar-stop-loss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance requests

      - name: Vigilar posiciones abiertas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot.py

      - name: Guardar estado de posiciones
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add posiciones.json
          git diff --staged --quiet || git commit -m "actualiza stop-loss dinámico"
          git push
