# VERSION: 1 (23/08/2026) - lanza diagnostico_fuentes.py a mano para medir que
# cobertura tiene Stooq de las bolsas europeas y si sus precios coinciden con
# los de Yahoo. No modifica nada del repo: solo imprime el resultado.
name: Manual · Diagnóstico de fuentes

on:
  workflow_dispatch: {}

jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install yfinance pandas requests
      - name: Probar fuentes
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python diagnostico_fuentes.py 2>&1 | tee resultado_fuentes.txt
      - name: Dejarlo en el resumen
        if: always()
        run: |
          echo '## Diagnostico de fuentes' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat resultado_fuentes.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
