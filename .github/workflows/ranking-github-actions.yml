# archivos generados se regeneran enteros cada vez, asÃ­ que si hay conflicto
# se queda siempre con la versiÃ³n reciÃ©n generada, sin atascarse
name: Actualizar ranking de candidatas

on:
  workflow_dispatch: {}   # solo corre cuando tÃº lo lanzas a mano, nunca solo

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas lxml deep-translator

      - name: Fase 1 - Screening (lote)
        run: python fase1_screening.py

      - name: Fase 2 - Scoring y ranking
        run: python fase2_scoring.py

      - name: Guardar resultados
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add candidatos_fase1.json candidatos_rankeados.json universo_tickers.json universo_por_indice.json
          git diff --staged --quiet || git commit -m "actualiza ranking de candidatas"
          git pull origin main --no-rebase -X ours
          git push