# VERSION: 11 (31/07/2026) - amplía a 7 ejecuciones automáticas al día
# (5:11, 7:11, 10:11, 12:11, 14:11, 16:11, 18:11 hora española), para que
# si GitHub se salta alguna (pasa, no da garantía de disparo con carga
# alta), sea mucho más probable que la siguiente sí se coja
name: Actualizar ranking de candidatas

on:
  schedule:
    - cron: '11 3 * * *'    # 05:11 España (verano)
    - cron: '11 5 * * *'    # 07:11 España (verano)
    - cron: '11 8 * * *'    # 10:11 España (verano)
    - cron: '11 10 * * *'   # 12:11 España (verano)
    - cron: '11 12 * * *'   # 14:11 España (verano)
    - cron: '11 14 * * *'   # 16:11 España (verano)
    - cron: '11 16 * * *'   # 18:11 España (verano)
  workflow_dispatch: {}   # y también cuando tú lo lanzas a mano

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas lxml deep-translator

      - name: Fase 1 - Screening (lote)
        run: python fase1_screening.py

      - name: Fase 2 - Scoring y ranking
        run: python fase2_scoring.py

      - name: Guardar resultados
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add candidatos_fase1.json candidatos_rankeados.json universo_tickers.json universo_por_indice.json
          git diff --staged --quiet || git commit -m "actualiza ranking de candidatas"
          git pull origin main --no-rebase -X ours
          git push

      - name: Enlaces directos
        run: |
          echo "## Ranking listo ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY