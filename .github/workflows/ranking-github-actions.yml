# VERSION: 9 (29/07/2026) - tres ejecuciones automáticas al día (7, 12 y 14
# hora española aprox.) para pillar resultados publicados antes de la
# apertura de mercado en distintos momentos de la mañana, + botón manual.
# En invierno (CET) se desplazan una hora porque el cron es en UTC fijo.
name: Actualizar ranking de candidatas

on:
  schedule:
    - cron: '0 5 * * *'    # 7:00 España (verano)
    - cron: '0 10 * * *'   # 12:00 España (verano)
    - cron: '0 12 * * *'   # 14:00 España (verano)
  workflow_dispatch: {}   # y también cuando tú lo lanzas a mano

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas lxml deep-translator

      - name: Fase 1 - Screening (lote)
        run: python fase1_screening.py

      - name: Fase 2 - Scoring y ranking
        run: python fase2_scoring.py

      - name: Guardar resultados
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add candidatos_fase1.json candidatos_rankeados.json universo_tickers.json universo_por_indice.json
          git diff --staged --quiet || git commit -m "actualiza ranking de candidatas"
          git pull origin main --no-rebase -X ours
          git push

      - name: Enlaces directos
        run: |
          echo "## Ranking listo ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [Abrir Cuaderno de candidatas](https://jmfc88.github.io/Finance/scoring_viewer.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 📒 [Abrir Simulador de operaciones](https://jmfc88.github.io/Finance/simulador.html)" >> $GITHUB_STEP_SUMMARY
