# VERSION: 14 (23/08/2026) - dos cambios: (1) añade historial_tarjetas.json,
# la ventana deslizante de 5 días con el contenido completo de las tarjetas,
# que el simulador necesita para enlazar una compra con la tarjeta que la
# motivó; sin esto el archivo se genera en la ejecución y se pierde al acabar.
# (2) el git add ya no falla si un archivo todavía no existe: antes bastaba
# con que faltara UNO (por ejemplo el primer día, antes de que fase3 lo
# hubiera creado) para que git devolviera error 128 y NO se subiera nada, ni
# siquiera el ranking. Ahora se comprueba archivo por archivo.
# VERSION: 13 (11/08/2026) - añade historial_scoring.json al git add, para
# que el histórico acumulado de puntuaciones (nuevo en fase3) se guarde de
# verdad en el repo cada vez
# VERSION: 12 (06/08/2026) - añade la Fase 3 (profundización con Google News
# más específico, solo sobre las mejores 25 candidatas) y reduce a 6
# ejecuciones al día, más espaciadas (4, 7, 10, 13, 16, 19h España), para
# dar tiempo a la pasada extra sin solaparse con la siguiente
name: Actualizar ranking de candidatas

on:
  schedule:
    - cron: '11 2 * * *'    # 04:11 España (verano)
    - cron: '11 5 * * *'    # 07:11 España (verano)
    - cron: '11 8 * * *'    # 10:11 España (verano)
    - cron: '11 11 * * *'   # 13:11 España (verano)
    - cron: '11 14 * * *'   # 16:11 España (verano)
    - cron: '11 17 * * *'   # 19:11 España (verano)
  workflow_dispatch: {}   # y también cuando tú lo lanzas a mano

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas lxml deep-translator requests

      - name: Fase 1 - Screening (lote)
        run: python fase1_screening.py

      - name: Fase 2 - Scoring y ranking
        run: python fase2_scoring.py

      - name: Fase 3 - Profundización (solo las mejores 25)
        run: python fase3_profundizar.py

      - name: Guardar resultados
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for f in candidatos_fase1.json candidatos_rankeados.json universo_tickers.json universo_por_indice.json historial_scoring.json historial_tarjetas.json; do
            if [ -f "$f" ]; then git add "$f"; else echo "aviso: $f todavia no existe, se omite"; fi
          done
          git diff --staged --quiet || git commit -m "actualiza ranking de candidatas"
          git pull origin main --no-rebase -X ours
          git push

      - name: Enlaces directos
        run: |
          echo "## Ranking listo ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [Abrir Cuaderno de candidatas](https://jmfc88.github.io/Finance/scoring_viewer.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 📒 [Abrir Simulador de operaciones](https://jmfc88.github.io/Finance/simulador.html)" >> $GITHUB_STEP_SUMMARY
