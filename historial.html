<!DOCTYPE html>
<!-- VERSION: 11 (24/08/2026) - carga el JS compartido con ?v=13 en la ruta.

POR QUE: el 24/08 el boton "Probar conexion" se quedaba colgado en
"Probando..." para siempre. Los dos archivos estaban bien subidos, pero el
navegador tenia CACHEADO el simulador-datos.js viejo: el HTML se actualizaba
y el JS no, asi que se llamaba a una funcion que en la version cacheada no
existia, saltaba un ReferenceError y el mensaje nunca se escribia.

Un fallo silencioso mas, y de los peores: todo parece correcto en GitHub y
en el movil no funciona. Anadiendo ?v=NN a la ruta, el navegador se ve
obligado a descargar el archivo nuevo. HAY QUE SUBIR EL NUMERO cada vez que
cambie simulador-datos.js, o volvera a pasar. -->
<!-- VERSION: 10 (23/08/2026) - usa simboloMoneda() de simulador-datos.js en
vez del "$" fijo, para que un valor de Madrid no aparezca como "4.288$". -->
<!-- VERSION: 9 (23/08/2026) - RECUPERADO. La v8 que había en el repo no era
esta página: era una copia del contenido de simulador-datos.js subida con el
nombre equivocado, sin una sola etiqueta HTML, por lo que el enlace "Ver
historial completo" del simulador no cargaba nada. Se ha restaurado la v6
desde el histórico de commits de GitHub y se le ha añadido lo único que le
faltaba respecto a simulador.html v26: el aviso de la regla antiaplicación
(art. 33.5 LIRPF) en las ventas con pérdida, con la fecha exacta a partir de
la cual se puede recomprar sin perder la deducción.

VERSION: 6 (21/08/2026) - misma tarjeta con desglose completo (precio ×
acciones + / − comisión = total) que simulador.html -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de operaciones</title>
<style>
  :root{
    --paper:#F2EEE3;
    --paper-line:#DCD5C2;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --green:#2F5233;
    --green-bg:#E4EBE0;
    --brick:#8C3B2E;
    --brick-bg:#F1E3DE;
    --gold:#B8860B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 28px),
      var(--paper);
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{ padding:20px 18px 12px; border-bottom:2px solid var(--ink); }
  h1{ margin:0; font-size:22px; }
  .sub{ font-family: ui-monospace, monospace; font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .volver{ display:inline-block; margin-top:8px; font-family: ui-monospace, monospace; font-size:12.5px; color:var(--ink); }
  section.panel{
    background:#fff;
    border:1px solid var(--ink);
    border-radius:3px;
    padding:14px 16px;
    margin:16px;
  }
  h2{ font-size:15px; margin:0 0 10px; }
  .fila{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  label{ font-family: ui-monospace, monospace; font-size:11.5px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  input, select{
    width:100%;
    padding:8px 9px;
    border:1px solid var(--ink-soft);
    background:#fff;
    font-family: ui-monospace, monospace;
    font-size:13px;
    border-radius:2px;
  }
  .campo{ flex:1; min-width:110px; }
  button{
    font-family: ui-monospace, monospace;
    font-size:13px;
    padding:9px 14px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:2px;
    cursor:pointer;
    margin-top:6px;
  }
  button:active{ opacity:0.8; }
  .resultado{
    font-family: ui-monospace, monospace;
    font-size:13.5px;
    margin-top:10px;
    padding:10px;
    background:var(--green-bg);
    border-left:3px solid var(--green);
    border-radius:2px;
  }
  .resultado.mal{ background:var(--brick-bg); border-left-color:var(--brick); }
  .tabla-scroll{ overflow-x:auto; margin-top:8px; }
  table{ width:100%; min-width:520px; border-collapse:collapse; font-family: ui-monospace, monospace; font-size:12px; }
  th, td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--paper-line); white-space:nowrap; }
  th{ color:var(--ink-soft); font-weight:normal; }
  .pos{ color:var(--green); }
  .neg{ color:var(--brick); }
  .nota{ font-family: ui-monospace, monospace; font-size:11px; color:var(--ink-soft); margin-top:8px; }
  .estado{ font-family: ui-monospace, monospace; font-size:13px; color:var(--ink-soft); padding:12px 0; }
</style>
</head>
<body>

<header>
  <h1>Historial completo</h1>
  <div class="sub">todas las operaciones registradas, editar y borrar</div>
  <a class="volver" href="simulador.html">← Volver al simulador</a>
</header>

<section class="panel" id="panel-edicion" style="display:none;">
  <h2>Editando operación</h2>
  <div class="fila">
    <div class="campo"><label>Tipo</label>
      <select id="op-tipo"><option value="compra">Compra</option><option value="venta">Venta</option></select>
    </div>
    <div class="campo"><label>Ticker</label><input id="op-ticker" type="text" style="text-transform:uppercase;"></div>
    <div class="campo"><label>Nombre de la empresa</label><input id="op-nombre" type="text"></div>
  </div>
  <div class="fila">
    <div class="campo"><label>Precio</label><input id="op-precio" type="text" inputmode="decimal" placeholder="ej: 23,77"></div>
    <div class="campo"><label>Acciones</label><input id="op-acciones" type="number" step="1"></div>
    <div class="campo"><label>Fecha</label><input id="op-fecha" type="date"></div>
  </div>
  <div class="fila">
    <div class="campo"><label>ISIN (opcional)</label><input id="op-isin" type="text"></div>
    <div class="campo"><label>Comisión real cobrada</label><input id="op-comision" type="text" inputmode="decimal" placeholder="1"></div>
  </div>
  <label style="display:flex; align-items:center; gap:6px; font-family: ui-monospace, monospace; font-size:12.5px; margin-bottom:8px;">
    <input id="op-cambio-divisa" type="checkbox">
    ¿Hubo cambio de divisa?
  </label>
  <button onclick="guardarEdicion()" style="background:var(--green);">Guardar cambios</button>
  <button onclick="cancelarEdicion()" style="background:var(--brick);">Cancelar</button>
</section>

<section class="panel">
  <h2>Todas las operaciones</h2>
  <div id="listado-operaciones"></div>
</section>

<script src="simulador-datos.js?v=13"></script>
<script>
/* Aviso de la regla antiaplicación en la tarjeta de una venta con pérdida.
La lógica vive en simulador-datos.js para no duplicarla entre las dos
páginas; aquí solo se pinta. */
function avisoFiscalTarjeta(op) {
  if (typeof avisoVentaConPerdida !== 'function') return '';
  const aviso = avisoVentaConPerdida(op);
  if (!aviso || !aviso.vigente) return '';
  return `<div style="margin-top:6px; padding:6px 8px; border-left:3px solid #b45309; background:#fffbeb; font-size:12px; line-height:1.5;">
    <b>Aviso fiscal:</b> ${aviso.texto}
  </div>`;
}
</script>
<script>
function parseNumeroEs(texto) {
  if (texto === null || texto === undefined) return NaN;
  return parseFloat(String(texto).replace(',', '.').trim());
}

let ledgerActual = [];
let editandoIndice = null;

function toggleGestionOp(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = (el.style.display === 'none' || !el.style.display) ? 'flex' : 'none';
}

function renderLedger(ledger) {
  ledgerActual = ledger;
  const cont = document.getElementById('listado-operaciones');
  if (ledger.length === 0) {
    cont.innerHTML = '<div class="estado">Todavía no hay operaciones registradas.</div>';
    return;
  }
  const conIndice = ledger.map((op, idx) => ({ op, idx })).reverse();
  cont.innerHTML = conIndice.map(({ op, idx }) => `
    <div style="padding:9px 11px; border:1px solid var(--ink); border-radius:3px; margin-bottom:7px; background:#fff;">
      <div onclick="toggleGestionOp('gestion-op-${idx}')" style="cursor:pointer;">
        <div style="display:flex; justify-content:space-between;">
          <b>${op.ticker}</b>
          <span style="font-family: ui-monospace, monospace; font-size:11.5px; color:var(--ink-soft);">${op.tipo} · ${op.fecha}</span>
        </div>
        <div style="font-family: ui-monospace, monospace; font-size:12px; color:var(--ink-soft);">
          ${op.nombre ? op.nombre + ' · ' : ''}${op.precio}${simboloMoneda(op.ticker)} × ${op.acciones} acc. ${op.tipo === 'compra' ? '+' : '−'} ${comisionEfectivaOp(op)}€ comisión = <b style="color:var(--ink);">${totalOperacion(op).toFixed(2)}€</b>${op.neto !== null ? ` · neto <span class="${op.neto>=0?'pos':'neg'}">${op.neto}€</span>` : ''}${avisoFiscalTarjeta(op)}
        </div>
      </div>
      <div id="gestion-op-${idx}" style="display:none; margin-top:8px; gap:6px;">
        <button onclick="iniciarEdicion(${idx})" style="font-size:12px;">Editar</button>
        <button onclick="eliminarOperacion(${idx})" style="font-size:12px; background:var(--brick);">Borrar</button>
      </div>
    </div>
  `).join('');
}

function iniciarEdicion(index) {
  const op = ledgerActual[index];
  if (!op) return;
  document.getElementById('op-tipo').value = op.tipo;
  document.getElementById('op-ticker').value = op.ticker;
  document.getElementById('op-nombre').value = op.nombre || '';
  document.getElementById('op-isin').value = op.isin || '';
  document.getElementById('op-precio').value = op.precio;
  document.getElementById('op-acciones').value = op.acciones;
  document.getElementById('op-fecha').value = op.fecha;
  document.getElementById('op-cambio-divisa').checked = !!op.cambio_divisa;
  document.getElementById('op-comision').value = op.comision !== undefined && op.comision !== null
    ? op.comision
    : (op.tipo === 'venta' ? COMISION_VENTA : COMISION_COMPRA);
  editandoIndice = index;
  document.getElementById('panel-edicion').style.display = 'block';
  document.getElementById('panel-edicion').scrollIntoView({ behavior: 'smooth' });
}

function cancelarEdicion() {
  editandoIndice = null;
  document.getElementById('panel-edicion').style.display = 'none';
}

async function guardarEdicion() {
  if (editandoIndice === null) return;
  const tipo = document.getElementById('op-tipo').value;
  const ticker = document.getElementById('op-ticker').value.trim().toUpperCase();
  const nombre = document.getElementById('op-nombre').value.trim();
  const isin = document.getElementById('op-isin').value.trim().toUpperCase();
  const precio = parseNumeroEs(document.getElementById('op-precio').value);
  const acciones = parseInt(document.getElementById('op-acciones').value);
  const fecha = document.getElementById('op-fecha').value;
  const cambioDivisa = document.getElementById('op-cambio-divisa').checked;
  const comisionInput = parseNumeroEs(document.getElementById('op-comision').value);
  const comision = isNaN(comisionInput) ? (tipo === 'venta' ? COMISION_VENTA : COMISION_COMPRA) : comisionInput;

  if (!ticker || !precio || !acciones || !fecha) {
    alert('Faltan datos: revisa ticker, precio, acciones y fecha.');
    return;
  }

  const ledger = await cargarLedger();
  ledger[editandoIndice] = {
    tipo, ticker, nombre, isin, precio, acciones, fecha, cambio_divisa: cambioDivisa, comision,
    acciones_restantes: tipo === 'compra' ? acciones : 0,
    neto: null,
  };
  recalcularFIFO(ledger);
  await guardarLedger(ledger);
  renderLedger(ledger);
  cancelarEdicion();
}

async function eliminarOperacion(index) {
  if (!confirm('¿Seguro que quieres eliminar esta operación? No se puede deshacer, y puede afectar al cálculo de ventas ya registradas de este mismo ticker.')) return;
  const ledger = await cargarLedger();
  ledger.splice(index, 1);
  recalcularFIFO(ledger);
  await guardarLedger(ledger);
  renderLedger(ledger);
}

async function inicializar() {
  const ledger = await cargarLedger();
  renderLedger(ledger);
}

inicializar();
</script>

</body>
</html>
